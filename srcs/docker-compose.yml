# for on vm
volumes:
    mariadb:
        driver: local
        driver_opts:
            type: none
            # device: /home/lzipp/data/mariadb # 42 computer
            device: Desktop/inceptionVolumes/mariadb
            o: bind
    wordpress:
        driver: local
        driver_opts:
            type: none
            # device: /home/lzipp/data/wordpress # 42 computer
            device: Desktop/inceptionVolumes/wordpress
            o: bind

networks:
    inception:
        name: inception

services:
    nginx:
        container_name: nginx
        build: ./dockerfiles/nginx/.
        ports:
            - "443:443"
        depends_on:
            - wordpress
        volumes:
            - ./web:/var/www/html
        networks:
            - inception
        env_file:
            - .env
        restart: always
    wordpress:
        container_name: wordpress
        build: ./dockerfiles/wordpress/.
        depends_on:
            - mariadb
        volumes:
            - ./web:/var/www/html
        env_file:
            - .env
        networks:
            - inception
        restart: always
    mariadb:
        container_name: mariadb
        build: ./dockerfiles/mariadb/.
        volumes:
            - mariadb:/var/lib/mysql
        env_file:
            - .env
        networks:
            - inception
        restart: always
